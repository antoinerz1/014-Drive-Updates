# Déploiement du site des mises à jour sur Cloudflare Pages (projet créé au premier passage).
name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Projet Pages
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID requis"; exit 1; }
          npx --yes wrangler@4 pages project list | grep -q "update-014drive" || npx --yes wrangler@4 pages project create update-014drive --production-branch main
      - name: Publication
        run: npx --yes wrangler@4 pages deploy site --project-name update-014drive --branch main --commit-dirty=true
